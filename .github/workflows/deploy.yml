name: CI & Deploy

on:
  push:
    branches: [main]

# Don't let two deploys run at once.
concurrency: deploy-main

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # uses the packageManager field in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

  e2e:
    name: E2E (Playwright)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  deploy:
    name: Deploy to Fly.io
    needs: [test, e2e] # only deploy if test + build passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          # Add this in GitHub: Settings → Secrets and variables → Actions → New
          # repository secret named FLY_API_TOKEN (value from `fly tokens create deploy`).
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
