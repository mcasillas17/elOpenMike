# fly.toml — Fly.io config for elOpenMike (Next.js standalone container)
#
# Before first deploy, set `app` to a globally-unique name (or let `fly launch`
# pick one) and `primary_region` to one near you (`fly platform regions` lists them).

app = "elopenmike"
primary_region = "sjc"

[build]
  [build.args]
    # Cloudflare Web Analytics beacon (public client-side token). Forwarded to
    # the Docker build so Next bakes it into the client bundle. Leave empty
    # to ship without analytics.
    NEXT_PUBLIC_CF_BEACON_TOKEN = "a14e2ed4e49548e5b1a7787b9da254a6"


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
